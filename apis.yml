aid: archive
name: Archive
description: >-
  Archive is a brand-owned resale and recommerce technology platform, founded in
  2021, that lets forward-thinking global brands launch and scale profitable,
  sustainable resale businesses. Its circularity platform spans branded
  recommerce storefronts, peer-to-peer marketplaces, trade-in (online and
  in-store), take-back, warranty and repair, a resale warehouse management
  system (WMS), a unified product catalog, a dynamic pricing engine, and
  analytics — reclaiming supply through returns, past-season inventory, consumer
  listings, and in-store trade-ins. Archive serves 50+ brands across 10+
  countries, including The North Face, lululemon, Peloton, New Balance, Dr.
  Martens, Fjällräven, Oscar de la Renta, Hanna Andersson, and Faherty. The
  company is backed by Bain Capital Ventures and Lightspeed Venture Partners
  (with Energize Capital leading its $30M Series B), and has raised $54M to date.
